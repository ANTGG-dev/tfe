# YOLO11n tiny-object focused: P1/P2/P3/P4 detection heads.
# Adds stride-2 detection for very tiny objects that may vanish by P2/P3.
nc: 2
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0 P1/2
  - [-1, 1, C3k2, [128, False, 0.25]]   # 1 P1 refined

  - [-1, 1, Conv, [128, 3, 2]]          # 2 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 3 P2 refined

  - [-1, 1, Conv, [256, 3, 2]]          # 4 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 5 P3 refined

  - [-1, 1, Conv, [512, 3, 2]]          # 6 P4/16
  - [-1, 2, C3k2, [512, True]]          # 7 P4 refined

  - [-1, 1, Conv, [1024, 3, 2]]         # 8 P5/32
  - [-1, 2, C3k2, [1024, True]]         # 9
  - [-1, 1, SPPF, [1024, 5]]            # 10
  - [-1, 2, C2PSA, [1024]]              # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12 P5 -> P4
  - [[-1, 7], 1, Concat, [1]]                   # 13
  - [-1, 2, C3k2, [512, False]]                 # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15 P4 -> P3
  - [[-1, 5], 1, Concat, [1]]                   # 16
  - [-1, 2, C3k2, [256, False]]                 # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18 P3 -> P2
  - [[-1, 3], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [128, False]]                 # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21 P2 -> P1
  - [[-1, 1], 1, Concat, [1]]                   # 22
  - [-1, 2, C3k2, [64, False]]                  # 23 P1 head

  - [-1, 1, Conv, [128, 3, 2]]                  # 24 P1 -> P2
  - [[-1, 20], 1, Concat, [1]]                  # 25
  - [-1, 2, C3k2, [128, False]]                 # 26 P2 out

  - [-1, 1, Conv, [256, 3, 2]]                  # 27 P2 -> P3
  - [[-1, 17], 1, Concat, [1]]                  # 28
  - [-1, 2, C3k2, [256, False]]                 # 29 P3 out

  - [-1, 1, Conv, [512, 3, 2]]                  # 30 P3 -> P4
  - [[-1, 14], 1, Concat, [1]]                  # 31
  - [-1, 2, C3k2, [512, False]]                 # 32 P4 out

  - [[23, 26, 29, 32], 1, Detect, [nc]]
