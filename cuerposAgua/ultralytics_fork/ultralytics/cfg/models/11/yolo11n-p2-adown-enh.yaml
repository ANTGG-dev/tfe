# Ultralytics YOLO11n detection + P2 + ADown-enhanced downsampling
nc: 2
scales:
  n: [0.50, 0.25, 1024]

# Backbone (P2/4 - P5/32)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]              # 0 - P1/2
  - [-1, 1, Conv,  [128, 3, 2]]             # 1 - P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]      # 2 - P2 refined (small objects)

  - [-1, 1, ADown, [256]]                   # 3 - P3/8  (ADown instead of Conv s2)
  - [-1, 2, C3k2,  [512, False, 0.25]]      # 4 - P3 refined

  - [-1, 1, ADown, [512]]                   # 5 - P4/16 (ADown instead of Conv s2)
  - [-1, 2, C3k2,  [512, True]]             # 6 - P4 refined

  - [-1, 1, ADown, [1024]]                  # 7 - P5/32 (ADown instead of Conv s2)
  - [-1, 2, C3k2,  [1024, True]]            # 8
  - [-1, 1, SPPF,  [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                  # 10 - P5 refined

# Head (P2, P3, P4, P5)
head:
  # Top-down FPN
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11: P5 -> P4
  - [[-1, 6], 1, Concat, [1]]                    # 12: cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 13: P4 head

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14: P4 -> P3
  - [[-1, 4], 1, Concat, [1]]                    # 15: cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 16: P3 head

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17: P3 -> P2
  - [[-1, 2], 1, Concat, [1]]                    # 18: cat backbone P2
  - [-1, 2, C3k2, [128, False]]                  # 19: P2 head (muy importante para tiny objects)

  # Bottom-up PAN
  - [-1, 1, Conv, [256, 3, 2]]                   # 20: P2 -> P3
  - [[-1, 16], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [256, False]]                  # 22: P3 out

  - [-1, 1, Conv, [512, 3, 2]]                   # 23: P3 -> P4
  - [[-1, 13], 1, Concat, [1]]                   # 24
  - [-1, 2, C3k2, [512, False]]                  # 25: P4 out

  - [-1, 1, Conv, [1024, 3, 2]]                  # 26: P4 -> P5
  - [[-1, 10], 1, Concat, [1]]                   # 27: cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                  # 28: P5 out

  # Detect(P2, P3, P4, P5)
  - [[19, 22, 25, 28], 1, Detect, [nc]]