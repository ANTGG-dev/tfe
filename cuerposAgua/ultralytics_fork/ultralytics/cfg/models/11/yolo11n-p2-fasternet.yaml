# Ultralytics YOLO11n + P2 + FasterNet(PConv) backbone
nc: 2
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # P2/4
  - [-1, 1, FNetStem, [64]]                   # 0
  - [-1, 1, PConvStage, [2, 0.25, 0.0, true]] # 1: (n=2, ratio=0.25, drop=0, eca=ON) -> P2

  # P3/8
  - [-1, 1, FNetDown, [128]]                  # 2
  - [-1, 1, PConvStage, [2, 0.25, 0.0, true]] # 3

  # P4/16
  - [-1, 1, FNetDown, [256]]                  # 4
  - [-1, 1, PConvStage, [2, 0.25, 0.0, true]] # 5

  # P5/32
  - [-1, 1, FNetDown, [512]]                  # 6
  - [-1, 1, PConvStage, [1, 0.25, 0.0, true]] # 7

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 2, C3k2, [64, False]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [[16, 19, 22, 25], 1, Detect, [nc]]