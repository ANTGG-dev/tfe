# YOLO11n P2 + SPD downsampling + high-resolution blocks + TinySCA attention
nc: 2
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, SPDConvDown, [128, 3, True]]
  - [-1, 1, TinyHRStage, [3, 3, 2, True, 1.5]]

  - [-1, 1, SPDConvDown, [256, 3, True]]
  - [-1, 1, TinyHRStage, [2, 3, 2, True, 1.5]]

  - [-1, 1, SPDConvDown, [512, 3, True]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, SPDConvDown, [1024, 3, True]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, TinyHRStage, [2, 3, 2, True, 1.5]]

  - [-1, 1, SPDConvDown, [256, 3, True]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, SPDConvDown, [512, 3, True]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, SPDConvDown, [1024, 3, True]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[19, 22, 25, 28], 1, Detect, [nc]]
