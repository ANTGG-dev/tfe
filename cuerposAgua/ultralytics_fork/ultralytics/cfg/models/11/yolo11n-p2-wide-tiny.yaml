# Wider P2 model for tiny objects: more P2/P3 capacity, still detects P2-P5.
nc: 2
scales:
  n: [0.67, 0.35, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1 P2/4
  - [-1, 3, C3k2, [256, False, 0.25]]      # 2 stronger P2

  - [-1, 1, ADown, [256]]                  # 3 P3/8
  - [-1, 3, C3k2, [512, False, 0.25]]      # 4 stronger P3

  - [-1, 1, ADown, [512]]                  # 5 P4/16
  - [-1, 2, C3k2, [768, True]]             # 6

  - [-1, 1, ADown, [1024]]                 # 7 P5/32
  - [-1, 2, C3k2, [1024, True]]            # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]            # 13 P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C3k2, [320, False]]            # 16 P3 stronger

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C3k2, [192, False]]            # 19 P2 stronger

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [320, False]]            # 22 P3 out

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]            # 25 P4 out

  - [-1, 1, Conv, [1024, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]            # 28 P5 out

  - [[19, 22, 25, 28], 1, Detect, [nc]]
